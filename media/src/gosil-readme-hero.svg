      <stop offset="55%" stop-color="#11151B" />
      <stop offset="100%" stop-color="#0C0E12" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="72%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#D4AF63" stop-opacity="0.11" />
      <stop offset="55%" stop-color="#B9C6D6" stop-opacity="0.045" />
      <stop offset="100%" stop-color="#0D0F13" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
