  <rect x="789.5" y="481.5" width="94" height="106.8" rx="7" fill="url(#barGold)" stroke="#E2C27A" stroke-opacity="0.45" stroke-width="1" /><text x="836.5" y="609.2" text-anchor="middle" fill="#F4F0E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15.5" font-weight="700">-194.45</text><text x="836.5" y="644" text-anchor="middle" fill="#A4ADB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">Metal Price</text><text x="836.5" y="664" text-anchor="middle" fill="#A4ADB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">Effect</text><rect x="966.5" y="359.5" width="94" height="122.0" rx="7" fill="url(#barSilver)" stroke="#C8D5E4" stroke-opacity="0.45" stroke-width="1" /><text x="1013.5" y="347.5" text-anchor="middle" fill="#F4F0E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15.5" font-weight="700">+222.23</text><text x="1013.5" y="644" text-anchor="middle" fill="#A4ADB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">Exchange Rate</text><text x="1013.5" y="664" text-anchor="middle" fill="#A4ADB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">Effect</text><rect x="1143.5" y="481.5" width="94" height="8.5" rx="7" fill="url(#barSlate)" stroke="#8FA0C0" stroke-opacity="0.45" stroke-width="1" /><text x="1190.5" y="511.0" text-anchor="middle" fill="#F4F0E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15.5" font-weight="700">-15.56</text><text x="1190.5" y="644" text-anchor="middle" fill="#A4ADB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">Combined</text><text x="1190.5" y="664" text-anchor="middle" fill="#A4ADB9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600">Effect</text><rect x="1320.5" y="474.8" width="94" height="6.7" rx="7" fill="url(#barPos)" stroke="#78D2A4" stroke-opacity="0.45" stroke-width="1" /><text x="1367.5" y="462.8" text-anchor="middle" fill="#F4F0E8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15.5" font-weight="700">+12.22</text><text x="1367.5" y="644" text-anchor="middle" fill="#F4F0E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Total Price</text><text x="1367.5" y="664" text-anchor="middle" fill="#F4F0E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700">Change</text>

