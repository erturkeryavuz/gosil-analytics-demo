  <rect x="92" y="338" width="56" height="2.5" rx="1.25" fill="#D4AF63" />

  <text x="92" y="404" fill="#CBD1DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
